<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grupo de Pregação N°6</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Grupo de Pregação N°6</h1>
      <h2>Congregação Capuame</h2>
    </header>

    <main class="cards">
      <h3 id="data">carregando data</h3>
      <h4 id="hora">carregando hora</h4>

      <div class="card calendario">
        <div class="grid-calendario" id="calendario"></div>
      </div>
      <div class="card">Card 2</div>
      <div class="card">Card 3</div>
      <div class="card">Card 4</div>
    </main>

    <footer></footer>
    <!-- Agenda Modal -->
    <div
      id="agendaModal"
      style="
        display: none;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: #fff;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        z-index: 1000;
      "
    >
      <h5 id="agendaDia">Anotações do dia</h5>
      <textarea id="nota" rows="5" style="width: 100%"></textarea>
      <button onclick="salvarNota()">Salvar</button>
      <button onclick="fecharAgenda()">Fechar</button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
