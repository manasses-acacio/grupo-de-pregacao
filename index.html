<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grupo de Pregação N°6</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <!doctype html>
  <html lang="pt-BR">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Grupo de Pregação N°6</title>
      <link rel="stylesheet" href="style.css" />
    </head>
    <body>
      <header>
        <h1>Grupo de Pregação N°6</h1>
        <h2>Congregação Capuame</h2>
      </header>

      <div class="data-hora">
        <h3 id="data">carregando data</h3>
        <h4 id="hora">carregando hora</h4>
      </div>

      <main class="cards">
        <div class="card calendario">
          <div class="grid-calendario" id="calendario"></div>
        </div>

        <div class="card" id="reunioes">
          <span class="title-reunioes">Reuniões</span>

          <div class="card-interno" id="meio-de-semana">
            <a href="meio-de-semana.html" class="cards-inter" target="_blank"
              >Meio de Semana</a
            >

            <a
              href="fim-de-semana.html"
              class="cards-inter"
              id="fim-de-semana"
              target="_blank"
              >Fim de Semana</a
            >
            <a
              href="congresso-assembleia.html"
              class="cards-inter"
              id="congresso-assembleia"
              target="_blank"
              >Congresso / Assembléia</a
            >
            <a
              href="especial.html"
              class="cards-inter"
              id="especial"
              target="_blank"
              >Especial</a
            >
          </div>
        </div>

        <div class="card" id="anuncios">Anúncios</div>
        <div class="card">Novidades</div>

        <div class="card" id="relatorio"></div>
        <div id="form-container" style="display: none">
          <form id="formulario">
            <fieldset>
              <legend>Relatório</legend>
              <div class="form-group">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" required />
              </div>

              <div class="form-group">
                <label for="mes">Mês:</label>
                <input type="month" id="mes" name="mes" required />
              </div>

              <div class="form-group">
                <label>
                  PUBLICADOR: Participou em Alguma Modalidade do Ministério este
                  Mês?
                  <input type="checkbox" id="publicador" name="publicador" />
                </label>
              </div>

              <div class="form-group">
                <label for="pioneiroAux">Pioneiro Auxiliar (horas):</label>
                <input
                  type="number"
                  id="pioneiroAux"
                  name="pioneiroAux"
                  min="0"
                />
              </div>

              <div class="form-group">
                <label for="pioneiroReg">Pioneiro Regular (horas):</label>
                <input
                  type="number"
                  id="pioneiroReg"
                  name="pioneiroReg"
                  min="0"
                />
              </div>

              <div class="form-group">
                <textarea
                  placeholder="Observações:"
                  name="obs"
                  rows="4"
                  cols="40"
                ></textarea>
              </div>
              <p id="mensagem" style="color: red; font-weight: bold"></p>
              <div id="botoes">
                <button type="reset">Limpar</button>
                <button type="submit">Enviar</button>
              </div>
            </fieldset>
          </form>
        </div>
      </main>

      <!-- Agenda Modal -->
      <div id="agendaModal" style="display: none">
        <h5 id="agendaDia">Anotações do dia</h5>
        <textarea
          placeholder="Anotações do dia:"
          id="nota"
          rows="5"
          style="width: 100%"
        ></textarea>
        <button onclick="salvarNota()">Salvar</button>
        <button onclick="fecharAgenda()">Fechar</button>
      </div>

      <footer>
        <h6 id="novidades">Novidades</h6>
      </footer>

      <script src="script.js"></script>
    </body>
  </html>
</html>
