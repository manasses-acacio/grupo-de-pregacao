<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grupo de Pregação N°6</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Grupo de Pregação N°6</h1>
      <h2>Congregação Capuame</h2>
    </header>

    <main class="cards">
      <h3 id="data">carregando data</h3>
      <h4 id="hora">carregando hora</h4>

      <div class="card calendario">
        <div class="grid-calendario" id="calendario"></div>
      </div>
      <div class="card" id="reunioes">Reuniões</div>
      <div class="card" id="anuncios">Anúncios</div>
      <div class="card">Novidades</div>
      <form action="">
        <div class="card" id="relatorio">Relatório de Serviço de Campo</div>
        <fieldset>
          <div>Nome</div>
          <div>Mês</div>
          <div>Publicador</div>
          <div>Pioneiro Auxiliar</div>
          <div>Pioneiro Regular</div>
          <div>Observações</div>
        </fieldset>
      </form>
    </main>

    <!-- Agenda Modal -->
    <div id="agendaModal">
      <h5 id="agendaDia">Anotações do dia</h5>
      <textarea id="nota" rows="5" style="width: 100%"></textarea>
      <button onclick="salvarNota()">Salvar</button>
      <button onclick="fecharAgenda()">Fechar</button>
    </div>

    <footer>
      <h6 id="novidades">Novidades</h6>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
